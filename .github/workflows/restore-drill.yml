name: SAMANVAY Full Database Restore Drill (Isolated)

on:
  workflow_dispatch:


permissions:
  contents: read
  actions: read

concurrency:
  group: samanvay-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Restore current production dump into disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate database connection secrets without displaying values
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_HOST SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
          echo "Database secret presence verified."

      - name: Create a fresh custom-format dump and capture source counts
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/samanvay-restore"
          docker run --rm \
            -e SUPABASE_DB_HOST -e SUPABASE_PROJECT_REF -e SUPABASE_DB_PASSWORD \
            -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            -v "$RUNNER_TEMP/samanvay-restore:/backup" \
            postgres:18-alpine sh -euc '
              export PGPASSWORD="$SUPABASE_DB_PASSWORD"
              pg_dump --host="$SUPABASE_DB_HOST" --port=5432 \
                --username="postgres.$SUPABASE_PROJECT_REF" --dbname=postgres \
                --format=custom --no-owner --no-acl --file=/backup/samanvay.dump
              psql --host="$SUPABASE_DB_HOST" --port=5432 \
                --username="postgres.$SUPABASE_PROJECT_REF" --dbname=postgres \
                --no-psqlrc --tuples-only --no-align --field-separator="," \
                --command="SELECT
                  (SELECT count(*) FROM public.groundwater_station_observations),
                  (SELECT count(*) FROM public.building_approval_public_register_records),
                  (SELECT count(*) FROM public.groundwater_district_assessments),
                  (SELECT count(*) FROM gis.underground_assets),
                  (SELECT count(*) FROM public.profiles);" \
                > /backup/source-counts.csv
              pg_restore --list /backup/samanvay.dump > /backup/archive-contents.txt
            '
          test -s "$RUNNER_TEMP/samanvay-restore/samanvay.dump"
          test -s "$RUNNER_TEMP/samanvay-restore/source-counts.csv"
          echo "Fresh production dump and source row-count snapshot created."

      - name: Start isolated Supabase PostgreSQL test instance
        run: |
          set -euo pipefail
          docker pull supabase/postgres:17.11.0.018
          docker run -d --name samanvay-restore-target \
            --shm-size=1gb \
            -e POSTGRES_USER=supabase_admin \
            -e POSTGRES_PASSWORD="restore-drill-only" \
            -e POSTGRES_DB=postgres \
            -p 54329:5432 \
            supabase/postgres:17.11.0.018
          for attempt in $(seq 1 90); do
            if docker exec samanvay-restore-target pg_isready -U supabase_admin -d postgres >/dev/null 2>&1; then
              echo "Disposable PostgreSQL instance is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Disposable PostgreSQL did not become ready."
          docker logs samanvay-restore-target
          exit 1

      - name: Prepare required Supabase API roles in the isolated instance
        run: |
          set -euo pipefail
          docker exec -i samanvay-restore-target psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $roles$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator LOGIN NOINHERIT;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dashboard_user') THEN
              CREATE ROLE dashboard_user NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'postgres') THEN
              CREATE ROLE postgres NOLOGIN;
            END IF;
          END
          $roles$;
          SQL

      - name: Restore complete database into the isolated instance
        run: |
          set -euo pipefail
          docker cp "$RUNNER_TEMP/samanvay-restore/samanvay.dump" \
            samanvay-restore-target:/tmp/samanvay.dump
          docker exec -e PGPASSWORD="restore-drill-only" -u root samanvay-restore-target \
            createdb --host=127.0.0.1 --username=supabase_admin \
            -T template0 samanvay_restore
          docker exec -e PGPASSWORD="restore-drill-only" -u root samanvay-restore-target pg_restore \
            --host=127.0.0.1 --username=supabase_admin \
            --exit-on-error --no-owner --no-acl --jobs=2 \
            --dbname=samanvay_restore /tmp/samanvay.dump
          echo "pg_restore completed without an error."

      - name: Compare restored data and validate spatial database
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < "$RUNNER_TEMP/samanvay-restore/source-counts.csv")"
          actual="$(docker exec -e PGPASSWORD="restore-drill-only" -u root samanvay-restore-target psql \
            --host=127.0.0.1 --username=supabase_admin -d samanvay_restore \
            --no-psqlrc --tuples-only --no-align --field-separator=',' \
            --command="SELECT
              (SELECT count(*) FROM public.groundwater_station_observations),
              (SELECT count(*) FROM public.building_approval_public_register_records),
              (SELECT count(*) FROM public.groundwater_district_assessments),
              (SELECT count(*) FROM gis.underground_assets),
              (SELECT count(*) FROM public.profiles);")"
          actual="$(printf '%s' "$actual" | tr -d '\r\n')"
          printf 'Source counts:   %s\nRestored counts: %s\n' "$expected" "$actual"
          test "$expected" = "$actual" || {
            echo "::error::Restored key-table row counts do not match the source snapshot."
            exit 1
          }
          docker exec -e PGPASSWORD="restore-drill-only" -u root samanvay-restore-target psql \
            --host=127.0.0.1 --username=supabase_admin -d samanvay_restore \
            -v ON_ERROR_STOP=1 -c "SELECT PostGIS_Full_Version();"
          docker exec -e PGPASSWORD="restore-drill-only" -u root samanvay-restore-target psql \
            --host=127.0.0.1 --username=supabase_admin -d samanvay_restore \
            -v ON_ERROR_STOP=1 -c "SELECT count(*) AS restored_public_tables FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';"
          echo "PASS: database restore, key-table row counts and PostGIS validation succeeded."

      - name: Publish restore-drill evidence
        if: always()
        run: |
          {
            echo "## SAMANVAY database restore drill"
            echo
            echo "- Target: disposable PostgreSQL container; production was read-only."
            echo "- Source: fresh custom-format pg_dump from the current Supabase project."
            echo "- Restore: pg_restore into an isolated database."
            echo "- Data validation: key-table row counts compared with the source snapshot."
            echo "- Spatial validation: PostGIS version query."
            echo "- Scope: PostgreSQL database only; Supabase Storage objects, Edge Function secrets, Auth settings and project configuration are not included in this database dump."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up disposable database and plaintext dump
        if: always()
        run: |
          docker rm -f samanvay-restore-target >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/samanvay-restore"
