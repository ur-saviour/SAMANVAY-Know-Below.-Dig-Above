name: SAMANVAY emergency groundwater compaction and auth recovery

on:
  push:
    branches:
      - feature/alpha-03-integrated-platform
    paths:
      - .github/workflows/recover-supabase-auth-readonly-v3.yml

permissions:
  contents: read

concurrency:
  group: samanvay-supabase-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and verify the previously published encrypted archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          mkdir -p "$RUNNER_TEMP/groundwater"
          gh release download samanvay-groundwater-raw-archive-42691241449 \
            --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/groundwater"
          cd "$RUNNER_TEMP/groundwater"
          sha256sum -c SHA256SUM
          export ARCHIVE_DIR="$PWD"
          python3 -m pip install --quiet cryptography==45.0.7
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          p = Path(os.environ["ARCHIVE_DIR"])
          meta = (p / "GROUNDWATER-ARCHIVE-METADATA.txt").read_text()
          assert "Source row count: 1911126" in meta, "Unexpected source row count"
          encrypted = (p / "SAMANVAY-groundwater-observations.dump.fernet").read_bytes()
          assert encrypted[:4] == b"SGW1", "Unexpected archive format"
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=encrypted[4:20], iterations=600000)
          key = base64.urlsafe_b64encode(kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()))
          raw = Fernet(key).decrypt(encrypted[20:])
          assert raw.startswith(b"PGDMP"), "Not a PostgreSQL custom dump"
          (p / "groundwater.dump").write_bytes(raw)
          print(f"PASS: verified encrypted archive, {len(raw)} dump bytes")
          PY

      - name: Extract 2025 observations from the verified archive
        run: |
          set -euo pipefail
          chmod 777 "$RUNNER_TEMP/groundwater"
          docker run -d --name samanvay-archive-db \
            -e POSTGRES_PASSWORD=local-only \
            -v "$RUNNER_TEMP/groundwater:/work" postgres:18-alpine
          for i in $(seq 1 60); do
            docker exec samanvay-archive-db pg_isready -U postgres && break
            sleep 2
          done
          docker exec samanvay-archive-db psql -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE TABLE public.groundwater_station_observations (
              id uuid NOT NULL,
              source_resource_id text NOT NULL,
              source_record_id bigint NOT NULL,
              station_name text NOT NULL,
              agency text NOT NULL,
              state_lgd_code text,
              state_name text NOT NULL,
              district_lgd_code text,
              district_name text NOT NULL,
              tehsil text,
              block_name text,
              village_name text,
              latitude numeric,
              longitude numeric,
              rl_msl_m numeric,
              observed_at_local timestamp without time zone NOT NULL,
              reported_level_m numeric,
              reported_level_text text,
              source_dataset_url text NOT NULL,
              imported_at timestamp with time zone NOT NULL,
              state_ut_id uuid
            );"
          docker exec samanvay-archive-db pg_restore -U postgres -d postgres \
            --data-only --no-owner --no-acl \
            --table=groundwater_station_observations /work/groundwater.dump
          docker exec samanvay-archive-db psql -U postgres -v ON_ERROR_STOP=1 -c "
            COPY (
              SELECT id, source_resource_id, source_record_id, station_name, agency,
                     state_lgd_code, state_name, district_lgd_code, district_name,
                     tehsil, block_name, village_name, latitude, longitude, rl_msl_m,
                     observed_at_local, reported_level_m, reported_level_text,
                     source_dataset_url, imported_at, state_ut_id
              FROM public.groundwater_station_observations
              WHERE observed_at_local >= timestamp '2025-01-01'
                AND observed_at_local < timestamp '2026-01-01'
            ) TO '/work/groundwater-2025.csv' WITH (FORMAT csv, HEADER true);"
          COUNT=$(docker exec samanvay-archive-db psql -U postgres -Atqc "
            SELECT count(*) FROM public.groundwater_station_observations
            WHERE observed_at_local >= timestamp '2025-01-01'
              AND observed_at_local < timestamp '2026-01-01';")
          test "$COUNT" = "446068"
          test -s "$RUNNER_TEMP/groundwater/groundwater-2025.csv"
          echo "PASS: extracted and validated $COUNT 2025 records from the encrypted backup."

      - name: Compact live database while preserving all 2025 observations
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/groundwater/recover.sql" <<'SQL'
          \\set ON_ERROR_STOP on
          SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE;
          SET default_transaction_read_only = off;
          DO $$
          BEGIN
            IF current_setting('default_transaction_read_only') <> 'off' THEN
              RAISE EXCEPTION 'Could not enable write transactions for recovery session';
            END IF;
          END $$;
          BEGIN;
          SET TRANSACTION READ WRITE;
          DO $$
          DECLARE all_rows bigint; recent_rows bigint;
          BEGIN
            SELECT count(*) INTO all_rows FROM public.groundwater_station_observations;
            SELECT count(*) INTO recent_rows FROM public.groundwater_station_observations WHERE observed_at_local >= timestamp '2025-01-01' AND observed_at_local < timestamp '2026-01-01';
            IF all_rows <> 1911126 OR recent_rows <> 446068 THEN RAISE EXCEPTION 'Live data no longer matches verified archive'; END IF;
          END $$;
          TRUNCATE TABLE public.groundwater_station_observations;
          COMMIT;
          BEGIN;
          SET TRANSACTION READ WRITE;
          \\copy public.groundwater_station_observations (id, source_resource_id, source_record_id, station_name, agency, state_lgd_code, state_name, district_lgd_code, district_name, tehsil, block_name, village_name, latitude, longitude, rl_msl_m, observed_at_local, reported_level_m, reported_level_text, source_dataset_url, imported_at, state_ut_id) FROM '/work/groundwater-2025.csv' WITH (FORMAT csv, HEADER true)
          DO $$
          DECLARE total_rows bigint; outside_rows bigint;
          BEGIN
            SELECT count(*) INTO total_rows FROM public.groundwater_station_observations;
            SELECT count(*) INTO outside_rows FROM public.groundwater_station_observations WHERE observed_at_local < timestamp '2025-01-01' OR observed_at_local >= timestamp '2026-01-01';
            IF total_rows <> 446068 OR outside_rows <> 0 THEN RAISE EXCEPTION 'Post-restore validation failed'; END IF;
          END $$;
          COMMIT;
          ANALYZE public.groundwater_station_observations;
          SELECT count(*) AS retained_2025_rows, pg_size_pretty(pg_database_size(current_database())) AS database_size, current_setting('transaction_read_only') AS transaction_read_only, current_setting('default_transaction_read_only') AS default_transaction_read_only FROM public.groundwater_station_observations;
          SQL
          docker run --rm --network host -e PGPASSWORD="$SUPABASE_DB_PASSWORD" -v "$RUNNER_TEMP/groundwater:/work:ro" postgres:18-alpine psql --host="$SUPABASE_DB_HOST" --port=5432 --username="postgres.$SUPABASE_PROJECT_REF" --dbname=postgres --no-password -v ON_ERROR_STOP=1 -f /work/recover.sql
      - name: Final read-only verification from a fresh database connection
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -e SUPABASE_DB_HOST -e SUPABASE_PROJECT_REF \
            postgres:18-alpine sh -euc '
              export PGSSLMODE=require
              psql --host="$SUPABASE_DB_HOST" --port=5432 \
                --username="postgres.$SUPABASE_PROJECT_REF" --dbname=postgres \
                --no-password -v ON_ERROR_STOP=1 -Atc "
                  SELECT
                    count(*) = 446068
                    AND count(*) FILTER (WHERE observed_at_local < timestamp '''2025-01-01'''
                                             OR observed_at_local >= timestamp '''2026-01-01''') = 0
                    AND pg_database_size(current_database()) < 500*1024*1024
                  FROM public.groundwater_station_observations;"
            '
