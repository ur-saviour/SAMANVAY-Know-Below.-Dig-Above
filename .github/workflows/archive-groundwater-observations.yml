name: SAMANVAY Groundwater Observation Table Archive

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alpha-03-integrated-platform
    paths:
      - '.github/workflows/archive-groundwater-observations.yml'

permissions:
  contents: write

concurrency:
  group: samanvay-groundwater-table-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Dump, encrypt, publish and verify groundwater table
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate existing secrets without displaying them
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_HOST SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD BACKUP_ENCRYPTION_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32
          echo "Secret presence and minimum passphrase length verified."

      - name: Create PostgreSQL table-only dump and verify stable row count
        id: dump
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/groundwater-archive"
          ROW_COUNT=$(docker run --rm \
            -e SUPABASE_DB_HOST -e SUPABASE_PROJECT_REF -e SUPABASE_DB_PASSWORD \
            -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            -v "$RUNNER_TEMP/groundwater-archive:/backup" \
            postgres:18-alpine sh -euc '
              export PGPASSWORD="$SUPABASE_DB_PASSWORD"
              CONN="--host=$SUPABASE_DB_HOST --port=5432 --username=postgres.$SUPABASE_PROJECT_REF --dbname=postgres"
              BEFORE=$(psql $CONN -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.groundwater_station_observations")
              test "$BEFORE" -gt 0
              pg_dump $CONN --format=custom --no-owner --no-acl \
                --table=public.groundwater_station_observations \
                --file=/backup/groundwater-station-observations.dump
              pg_restore --list /backup/groundwater-station-observations.dump >/backup/archive-contents.txt
              AFTER=$(psql $CONN -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.groundwater_station_observations")
              test "$BEFORE" = "$AFTER"
              printf "%s\n" "$AFTER"
            ')
          case "$ROW_COUNT" in
            ''|*[!0-9]*) echo "::error::Could not validate groundwater row count."; exit 1 ;;
          esac
          echo "row_count=$ROW_COUNT" >> "$GITHUB_OUTPUT"
          test -s "$RUNNER_TEMP/groundwater-archive/groundwater-station-observations.dump"
          echo "PASS: table dump created; source row count remained stable at $ROW_COUNT."

      - name: Encrypt table dump and create SHA-256 manifest
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          EXPECTED_ROW_COUNT: ${{ steps.dump.outputs.row_count }}
        run: |
          set -euo pipefail
          export BACKUP_DIR="$RUNNER_TEMP/groundwater-archive"
          python3 -m venv "$RUNNER_TEMP/groundwater-venv"
          "$RUNNER_TEMP/groundwater-venv/bin/pip" install --quiet --disable-pip-version-check 'cryptography==45.0.7'
          "$RUNNER_TEMP/groundwater-venv/bin/python" - <<'PY'
          import base64, hashlib, os
          from datetime import datetime, timezone
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          folder = Path(os.environ["BACKUP_DIR"])
          raw_path = folder / "groundwater-station-observations.dump"
          raw = raw_path.read_bytes()
          salt = os.urandom(16)
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=600000)
          key = base64.urlsafe_b64encode(kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()))
          encrypted = folder / "SAMANVAY-groundwater-observations.dump.fernet"
          encrypted.write_bytes(b"SGW1" + salt + Fernet(key).encrypt(raw))
          digest = hashlib.sha256(encrypted.read_bytes()).hexdigest()
          (folder / "SHA256SUM").write_text(f"{digest}  {encrypted.name}\n")
          (folder / "GROUNDWATER-ARCHIVE-METADATA.txt").write_text(
              "SAMANVAY groundwater station observations table archive\n"
              f"Created UTC: {datetime.now(timezone.utc).isoformat()}\n"
              f"Source row count: {os.environ['EXPECTED_ROW_COUNT']}\n"
              f"Encrypted bytes: {encrypted.stat().st_size}\n"
              f"SHA-256: {digest}\n"
              "Format: PostgreSQL custom archive, Fernet encrypted\n"
              "Key derivation: PBKDF2-HMAC-SHA256, 600000 iterations\n"
              "Decryption secret is not included in this release.\n"
              "Restore into an existing Samanvay database schema using pg_restore --data-only.\n"
          )
          raw_path.unlink()
          print(f"Encrypted table archive prepared ({encrypted.stat().st_size} bytes).")
          PY

      - name: Verify local encryption, checksum and PostgreSQL format
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          export VERIFY_DIR="$RUNNER_TEMP/groundwater-archive"
          "$RUNNER_TEMP/groundwater-venv/bin/python" - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          folder = Path(os.environ["VERIFY_DIR"])
          encrypted = folder / "SAMANVAY-groundwater-observations.dump.fernet"
          expected = (folder / "SHA256SUM").read_text().split()[0]
          if hashlib.sha256(encrypted.read_bytes()).hexdigest() != expected:
              raise SystemExit("Groundwater archive checksum mismatch.")
          payload = encrypted.read_bytes()
          if payload[:4] != b"SGW1":
              raise SystemExit("Unknown groundwater archive envelope.")
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=payload[4:20], iterations=600000)
          key = base64.urlsafe_b64encode(kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()))
          raw = Fernet(key).decrypt(payload[20:])
          if not raw.startswith(b"PGDMP"):
              raise SystemExit("Decrypted content is not a PostgreSQL custom-format archive.")
          (folder / "verified.dump").write_bytes(raw)
          print(f"PASS: checksum and decryption verified ({len(raw)} dump bytes).")
          PY
          docker run --rm -v "$RUNNER_TEMP/groundwater-archive:/backup" postgres:18-alpine \
            pg_restore --list /backup/verified.dump > "$RUNNER_TEMP/groundwater-archive/catalogue.txt"
          grep -q 'groundwater_station_observations' "$RUNNER_TEMP/groundwater-archive/catalogue.txt"
          echo "PASS: archive catalogue contains groundwater_station_observations."

      - name: Publish encrypted table archive as a durable GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: samanvay-groundwater-raw-archive-${{ github.run_id }}
          name: SAMANVAY Groundwater Raw Observation Archive ${{ github.run_number }}
          body: |
            Dedicated encrypted archive of public.groundwater_station_observations.
            - Encrypted before upload; no plaintext observations or decryption secret are published.
            - Includes SHA-256 manifest and source row count metadata.
            - Checksum, decryption and PostgreSQL archive catalogue were verified before release.
            - Restore requires the existing Samanvay database schema and BACKUP_ENCRYPTION_PASSPHRASE.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/groundwater-archive/SAMANVAY-groundwater-observations.dump.fernet
            ${{ runner.temp }}/groundwater-archive/SHA256SUM
            ${{ runner.temp }}/groundwater-archive/GROUNDWATER-ARCHIVE-METADATA.txt

      - name: Download the published Release and verify it independently
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          TAG="samanvay-groundwater-raw-archive-${{ github.run_id }}"
          mkdir -p "$RUNNER_TEMP/groundwater-published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/groundwater-published" \
            --pattern 'SAMANVAY-groundwater-observations.dump.fernet' \
            --pattern 'SHA256SUM' \
            --pattern 'GROUNDWATER-ARCHIVE-METADATA.txt'
          cd "$RUNNER_TEMP/groundwater-published"
          sha256sum -c SHA256SUM
          export VERIFY_DIR="$PWD"
          "$RUNNER_TEMP/groundwater-venv/bin/python" - <<'PY'
          import base64, os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          folder = Path(os.environ["VERIFY_DIR"])
          payload = (folder / "SAMANVAY-groundwater-observations.dump.fernet").read_bytes()
          if payload[:4] != b"SGW1":
              raise SystemExit("Unknown published groundwater archive format.")
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=payload[4:20], iterations=600000)
          key = base64.urlsafe_b64encode(kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()))
          raw = Fernet(key).decrypt(payload[20:])
          if not raw.startswith(b"PGDMP"):
              raise SystemExit("Published archive did not decrypt to PostgreSQL custom format.")
          (folder / "published-verified.dump").write_bytes(raw)
          print(f"PASS: published archive downloaded and decrypted ({len(raw)} dump bytes).")
          PY
          docker run --rm -v "$RUNNER_TEMP/groundwater-published:/backup" postgres:18-alpine \
            pg_restore --list /backup/published-verified.dump > /dev/null
          echo "PASS: published GitHub Release asset verified after download."

      - name: Publish archive summary
        if: success()
        run: |
          {
            echo "## Groundwater raw-table archive — PASS"
            echo ""
            echo "- Rows archived: ${{ steps.dump.outputs.row_count }}"
            echo "- Destination: durable encrypted GitHub Release asset"
            echo "- Verification: source row-count stability, SHA-256, decryption, PostgreSQL archive catalogue, Release download and re-verification"
            echo "- No plaintext dump or decryption secret was uploaded."
            echo "- The live Supabase table was not modified by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
