name: Secure SAMANVAY Database Backup to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samanvay-r2-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate configuration
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for name in SUPABASE_DATABASE_URL BACKUP_ENCRYPTION_PASSPHRASE R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 characters."
            exit 1
          fi
          case "$SUPABASE_DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DATABASE_URL must be a PostgreSQL connection URI."; exit 1 ;;
          esac
          echo "Required secrets are present. Values are not displayed."

      - name: Install backup tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3-venv
          aws --version
          pg_dump --version
          pg_restore --version

      - name: Create and validate full database dump
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/samanvay-r2-backup"
          mkdir -p "$BACKUP_DIR"
          echo "Creating a full logical PostgreSQL database dump."
          echo "Use Supabase Direct or Session Pooler connection details; do not use Transaction Pooler for pg_dump."
          pg_dump --dbname="$SUPABASE_DATABASE_URL" --format=custom --no-owner --no-acl --verbose --file="$BACKUP_DIR/samanvay-full.dump"
          test -s "$BACKUP_DIR/samanvay-full.dump"
          pg_restore --list "$BACKUP_DIR/samanvay-full.dump" > "$BACKUP_DIR/archive-contents.txt"
          test -s "$BACKUP_DIR/archive-contents.txt"
          echo "Full database dump created; archive catalogue validation passed."

      - name: Encrypt backup and create checksum
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/samanvay-r2-backup"
          export BACKUP_DIR
          python3 -m venv "$RUNNER_TEMP/backup-venv"
          "$RUNNER_TEMP/backup-venv/bin/pip" install --quiet --disable-pip-version-check 'cryptography==45.0.7'
          "$RUNNER_TEMP/backup-venv/bin/python" - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          folder = Path(os.environ["BACKUP_DIR"])
          source = folder / "samanvay-full.dump"
          target = folder / "SAMANVAY-full-database.dump.fernet"
          raw = source.read_bytes()
          salt = os.urandom(16)
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=600000)
          key = base64.urlsafe_b64encode(kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()))
          target.write_bytes(b"SAM2" + salt + Fernet(key).encrypt(raw))
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (folder / "SHA256SUM").write_text(f"{digest}  {target.name}\n")
          if target.stat().st_size <= 20 or not digest:
              raise SystemExit("Encrypted archive validation failed.")
          source.unlink()
          print(f"Encrypted archive ready: {target.name}")
          print(f"Encrypted archive size: {target.stat().st_size} bytes")
          print(f"SHA-256: {digest}")
          PY

      - name: Upload encrypted archive to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/samanvay-r2-backup"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          OBJECT_KEY="samanvay/postgres/${STAMP}-run-${GITHUB_RUN_ID}/SAMANVAY-full-database.dump.fernet"
          aws s3 cp "$BACKUP_DIR/SAMANVAY-full-database.dump.fernet" "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}" --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "$BACKUP_DIR/SHA256SUM" "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}.sha256" --endpoint-url "$ENDPOINT" --only-show-errors
          echo "R2_OBJECT_KEY=$OBJECT_KEY" >> "$GITHUB_ENV"
          echo "R2_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "Encrypted archive and checksum uploaded."

      - name: Download from R2 and verify remote copy
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/samanvay-r2-backup"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p "$BACKUP_DIR/remote-check"
          aws s3 cp "s3://${R2_BUCKET_NAME}/${R2_OBJECT_KEY}" "$BACKUP_DIR/remote-check/SAMANVAY-full-database.dump.fernet" --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "s3://${R2_BUCKET_NAME}/${R2_OBJECT_KEY}.sha256" "$BACKUP_DIR/remote-check/SHA256SUM" --endpoint-url "$ENDPOINT" --only-show-errors
          cd "$BACKUP_DIR/remote-check"
          sha256sum --check SHA256SUM
          echo "Remote R2 download matches the uploaded encrypted archive."

      - name: Decrypt remote copy and validate PostgreSQL archive
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/samanvay-r2-backup"
          export BACKUP_DIR
          "$RUNNER_TEMP/backup-venv/bin/python" - <<'PY'
          import base64, os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          folder = Path(os.environ["BACKUP_DIR"]) / "remote-check"
          payload = (folder / "SAMANVAY-full-database.dump.fernet").read_bytes()
          if payload[:4] != b"SAM2":
              raise SystemExit("Unknown encrypted backup format.")
          salt, token = payload[4:20], payload[20:]
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=600000)
          key = base64.urlsafe_b64encode(kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode()))
          plaintext = Fernet(key).decrypt(token)
          if not plaintext.startswith(b"PGDMP"):
              raise SystemExit("Decrypted file is not a PostgreSQL custom-format archive.")
          output = folder / "verified-remote.dump"
          output.write_bytes(plaintext)
          print(f"Remote archive decrypted successfully ({len(plaintext)} bytes).")
          PY
          pg_restore --list "$BACKUP_DIR/remote-check/verified-remote.dump" > /dev/null
          echo "PASS: R2 object downloaded, SHA-256 matched, decryption succeeded, and PostgreSQL archive catalogue validated."
          echo "NOTE: This is an archive-integrity test, not a full restore-to-separate-database test."

      - name: Publish backup verification summary
        if: success()
        run: |
          {
            echo "## SAMANVAY external backup verified"
            echo ""
            echo "- Destination: Cloudflare R2"
            echo "- Object: `$R2_OBJECT_KEY`"
            echo "- Verification: remote download, SHA-256, decryption and pg_restore catalogue checks passed."
            echo "- Scope: full logical PostgreSQL database dump."
            echo "- Restore drill: not performed; this run verifies archive integrity, not recoverability in a separate database."
          } >> "$GITHUB_STEP_SUMMARY"
