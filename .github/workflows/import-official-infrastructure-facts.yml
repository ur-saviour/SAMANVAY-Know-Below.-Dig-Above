name: Import official Coimbatore utility project facts

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alpha-03-integrated-platform
    paths:
      - 'scripts/import_official_coimbatore_utility_facts.py'
      - '.github/workflows/import-official-infrastructure-facts.yml'

permissions:
  contents: read

jobs:
  import-authority-facts:
    name: Import verified aggregate utility facts and approval search audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL client dependency
        run: python -m pip install --disable-pip-version-check "psycopg2-binary==2.9.10"

      - name: Import official municipal project facts and approval search audit
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/import_official_coimbatore_utility_facts.py
