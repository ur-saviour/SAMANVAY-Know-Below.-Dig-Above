name: Verify pre-change groundwater archive (no production writes)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samanvay-groundwater-archive-verification
  cancel-in-progress: false

jobs:
  verify-archive:
    name: Decrypt and count the archived groundwater table in disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download encrypted archive and verify its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/groundwater"
          gh release download samanvay-groundwater-raw-archive-42691241449 \
            --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/groundwater"
          cd "$RUNNER_TEMP/groundwater"
          sha256sum -c SHA256SUM
          test -s GROUNDWATER-ARCHIVE-METADATA.txt
          grep -F "Source row count: 1911126" GROUNDWATER-ARCHIVE-METADATA.txt

      - name: Decrypt archive and verify PostgreSQL custom-dump format
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          export ARCHIVE_DIR="$RUNNER_TEMP/groundwater"
          python3 -m pip install --quiet cryptography==45.0.7
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          folder = Path(os.environ["ARCHIVE_DIR"])
          metadata = (folder / "GROUNDWATER-ARCHIVE-METADATA.txt").read_text()
          if "Source row count: 1911126" not in metadata:
              raise SystemExit("Archive metadata does not match the expected pre-change count.")

          encrypted = (folder / "SAMANVAY-groundwater-observations.dump.fernet").read_bytes()
          if encrypted[:4] != b"SGW1":
              raise SystemExit("Unexpected groundwater archive format.")

          kdf = PBKDF2HMAC(
              algorithm=hashes.SHA256(),
              length=32,
              salt=encrypted[4:20],
              iterations=600000,
          )
          key = base64.urlsafe_b64encode(
              kdf.derive(os.environ["BACKUP_ENCRYPTION_PASSPHRASE"].encode())
          )
          dump = Fernet(key).decrypt(encrypted[20:])
          if not dump.startswith(b"PGDMP"):
              raise SystemExit("Decrypted archive is not a PostgreSQL custom-format dump.")

          (folder / "groundwater.dump").write_bytes(dump)
          print(f"PASS: decrypted archive; {len(dump)} PostgreSQL dump bytes.")
          PY
          docker run --rm \
            -v "$RUNNER_TEMP/groundwater:/work:ro" \
            postgres:18-alpine pg_restore --list /work/groundwater.dump >/dev/null
          echo "PASS: PostgreSQL archive catalogue is readable."

      - name: Restore archived table only into disposable local PostgreSQL
        run: |
          set -euo pipefail
          chmod 777 "$RUNNER_TEMP/groundwater"
          docker run -d --name samanvay-groundwater-archive-check \
            -e POSTGRES_PASSWORD=local-only \
            -v "$RUNNER_TEMP/groundwater:/work" \
            postgres:18-alpine

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec samanvay-groundwater-archive-check pg_isready -U postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          docker exec samanvay-groundwater-archive-check psql -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE TABLE public.groundwater_station_observations (
              id uuid NOT NULL,
              source_resource_id text NOT NULL,
              source_record_id bigint NOT NULL,
              station_name text NOT NULL,
              agency text NOT NULL,
              state_lgd_code text,
              state_name text NOT NULL,
              district_lgd_code text,
              district_name text NOT NULL,
              tehsil text,
              block_name text,
              village_name text,
              latitude numeric,
              longitude numeric,
              rl_msl_m numeric,
              observed_at_local timestamp without time zone NOT NULL,
              reported_level_m numeric,
              reported_level_text text,
              source_dataset_url text NOT NULL,
              imported_at timestamp with time zone NOT NULL,
              state_ut_id uuid
            );"

          docker exec samanvay-groundwater-archive-check pg_restore -U postgres -d postgres \
            --data-only --no-owner --no-acl \
            --table=groundwater_station_observations /work/groundwater.dump

      - name: Validate complete historical count and 2025 subset
        run: |
          set -euo pipefail
          ALL_COUNT=$(docker exec samanvay-groundwater-archive-check psql -U postgres -Atqc "
            SELECT count(*) FROM public.groundwater_station_observations;")
          YEAR_COUNT=$(docker exec samanvay-groundwater-archive-check psql -U postgres -Atqc "
            SELECT count(*) FROM public.groundwater_station_observations
            WHERE observed_at_local >= timestamp '2025-01-01'
              AND observed_at_local < timestamp '2026-01-01';")
          OUTSIDE_COUNT=$(docker exec samanvay-groundwater-archive-check psql -U postgres -Atqc "
            SELECT count(*) FROM public.groundwater_station_observations
            WHERE observed_at_local < timestamp '2025-01-01'
               OR observed_at_local >= timestamp '2026-01-01';")
          test "$ALL_COUNT" = "1911126"
          test "$YEAR_COUNT" = "446068"
          test "$OUTSIDE_COUNT" = "1465058"

          docker exec samanvay-groundwater-archive-check psql -U postgres -c "
            SELECT
              count(*) AS archived_rows,
              count(*) FILTER (WHERE latitude IS NOT NULL AND longitude IS NOT NULL) AS geocoded_rows,
              min(observed_at_local) AS oldest_observation,
              max(observed_at_local) AS newest_observation
            FROM public.groundwater_station_observations;"

          {
            echo "## Groundwater archive verification — PASS"
            echo
            echo "- Full pre-change archive rows: $ALL_COUNT"
            echo "- Calendar-year 2025 rows: $YEAR_COUNT"
            echo "- Rows outside 2025: $OUTSIDE_COUNT"
            echo "- Scope: archive asset restored only in a disposable local PostgreSQL container."
            echo "- Production database: not contacted; no production write credentials were supplied."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove disposable PostgreSQL container and plaintext archive
        if: always()
        run: |
          docker rm -f samanvay-groundwater-archive-check >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/groundwater"
