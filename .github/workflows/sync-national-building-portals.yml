name: Sync nationwide building approval portal registry

on:
  workflow_dispatch:
  push:
    branches:
      - feature/alpha-03-integrated-platform
    paths:
      - 'scripts/sync_national_building_portals.py'
      - '.github/workflows/sync-national-building-portals.yml'

permissions:
  contents: read

jobs:
  sync-building-portals:
    name: Sync verified State/UT building approval sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL client dependency
        run: python -m pip install --disable-pip-version-check "psycopg2-binary==2.9.10"

      - name: Sync portal discovery metadata only
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python scripts/sync_national_building_portals.py
