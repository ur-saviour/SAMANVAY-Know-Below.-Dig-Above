


name: Build SAMANVAY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/alpha-03-integrated-platform
    paths:
      - 'app/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: samanvay-android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, Diagnose and Publish APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Generate Android project
      - name: Generate Android project
        run: |
          flutter create \
            --project-name samanvay \
            --org in.samanvay \
            --platforms android \
            /tmp/samanvay_scaffold

          cp -R /tmp/samanvay_scaffold/android .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """
          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Android application tag not found")

              content = content.replace(
                  "<application",
                  permissions + "\n    <application",
                  1,
              )
          deep_link_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="in.samanvay"
                          android:host="login-callback" />
                  </intent-filter>
          """

          if "android:host=\"login-callback\"" not in content:
              content = content.replace(
                  "</activity>",
                  deep_link_filter + "\n        </activity>",
                  1,
              )
          manifest.write_text(content)
          PY

          cp /tmp/samanvay_scaffold/pubspec.yaml .
          cp /tmp/samanvay_scaffold/analysis_options.yaml .
          cp /tmp/samanvay_scaffold/.metadata .

          mkdir -p lib assets/reference/coimbatore
          cp app/main.dart lib/main.dart

          if [ ! -s assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson ]; then
            echo "ERROR: Coimbatore ward reference GeoJSON is missing from the repository."
            exit 1
          fi

          if [ ! -s assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson ]; then
            echo "ERROR: Coimbatore groundwater telemetry GeoJSON is missing from the repository."
            exit 1
          fi

      # 5. Install dependencies
      - name: Install Flutter dependencies
        run: |
          flutter pub add supabase_flutter
          flutter pub add maplibre_gl:0.27.1
          flutter pub add latlong2
          flutter pub add google_fonts
          flutter pub add url_launcher
          flutter pub add file_picker
          # Pin the permission plugin to the Android-36-compatible release line.
          flutter pub add permission_handler:12.0.3
          flutter pub add http
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          content = path.read_text()
          if "dependency_overrides:" not in content:
              content += chr(10) + "dependency_overrides:" + chr(10) + "  permission_handler_android: 13.0.1" + chr(10)

          asset_entry = "    - assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson"
          if asset_entry not in content:
              if chr(10) + "flutter:" + chr(10) not in content:
                  raise SystemExit("Flutter section not found in generated pubspec.yaml")
              content = content.replace(
                  chr(10) + "flutter:" + chr(10),
                  chr(10) + "flutter:" + chr(10) + "  assets:" + chr(10) + asset_entry + chr(10),
                  1,
              )

          groundwater_entry = "    - assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson"
          if groundwater_entry not in content:
              if asset_entry not in content:
                  raise SystemExit("Coimbatore ward asset entry not found")
              content = content.replace(
                  asset_entry,
                  asset_entry + chr(10) + groundwater_entry,
                  1,
              )
          path.write_text(content)
          PY
          echo "Verifying Flutter asset declarations before build..."
          grep -F "assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson" pubspec.yaml
          grep -F "assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson" pubspec.yaml
          test -s assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson
          test -s assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson
          flutter pub get

      # 6. Check Dart code
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 7. Build APK
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY"

      # 8. Prepare smaller ABI-specific APKs for Android devices
      - name: Prepare downloadable APKs
        run: |
          set -euo pipefail
          mkdir -p dist

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SOURCE="build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            DEST="dist/SAMANVAY-Alpha-0.3-${ABI}.apk"

            if [ ! -s "$SOURCE" ]; then
              echo "ERROR: Expected APK not found: $SOURCE"
              exit 1
            fi

            cp "$SOURCE" "$DEST"
          done

          echo "Prepared ABI-specific APKs:"
          ls -lh dist/*.apk
          sha256sum dist/*.apk

      # 9. APK checks are required; failures fail the build
      - name: Verify APK package, signature and alignment
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools unavailable."
            exit 1
          fi

          for APK in dist/*.apk; do
            echo "========== VERIFYING $APK =========="
            file "$APK"
            unzip -t "$APK" >/dev/null
            "$BUILD_TOOLS/aapt" dump badging "$APK"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

            for REQUIRED_ASSET in \
              "assets/flutter_assets/assets/reference/coimbatore/coimbatore_wards_2024_public_domain.geojson" \
              "assets/flutter_assets/assets/reference/coimbatore/groundwater_telemetry_2026_2030.geojson"; do
              if ! unzip -l "$APK" | grep -Fq "$REQUIRED_ASSET"; then
                echo "ERROR: Required GIS data asset missing from APK: $REQUIRED_ASSET"
                exit 1
              fi
              echo "Verified GIS data asset in APK: $REQUIRED_ASSET"
            done
          done

      # 10. Upload all ABI-specific APKs
      - name: Upload APK downloads
        if: always() && hashFiles('dist/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAMANVAY-Alpha-0.3-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Publish/update the Alpha 0.3 prerelease on successful builds
      - name: Publish SAMANVAY Alpha 0.3
        if: hashFiles('dist/*.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-alpha-0.3
          name: SAMANVAY Alpha 0.3
          body: |
            SAMANVAY Android Application
            Version: Alpha 0.3

            Includes:
            - ABI-specific Flutter release APKs (ARM64, ARMv7, x86_64)
            - Coimbatore 2024 Public Domain ward-boundary reference layer (OpenCity.in)
            - 21 Coimbatore district groundwater telemetry station points from NWDP 2026–2030 snapshot
            - Verified department-owned GIS asset map layer (when owner data is registered and verified)
            - Device GPS coordinate display and OpenStreetMap place search fallback
            - Supabase integration foundation
            - Required APK integrity, signature and alignment checks

            Note: The ward boundary layer is a 2024 public reference and is not a statutory boundary certification or an underground utility dataset.

          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*.apk
