
name: Build SAMANVAY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build SAMANVAY Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --project-name samanvay \
            --org in.samanvay \
            --platforms android \
            /tmp/samanvay_scaffold

          cp -R /tmp/samanvay_scaffold/android .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Android application tag not found")

              content = content.replace(
                  "<application",
                  permission + "\n    <application",
                  1,
              )

          manifest.write_text(content)
          PY

          cp /tmp/samanvay_scaffold/pubspec.yaml .
          cp /tmp/samanvay_scaffold/analysis_options.yaml .
          cp /tmp/samanvay_scaffold/.metadata .

          mkdir -p lib
          cp app/main.dart lib/main.dart

      - name: Install Flutter dependencies
        run: |
          flutter pub add supabase_flutter
          flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Validate APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"
          unzip -t "$APK"

          mkdir -p dist
          cp "$APK" dist/SAMANVAY-Alpha-0.2.apk

          ls -lh dist/

      - name: Publish SAMANVAY Alpha 0.2
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-alpha-0.2
          name: SAMANVAY Alpha 0.2
          body: |
            SAMANVAY Android Application
            Version: Alpha 0.2
            Includes Supabase integration foundation.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/SAMANVAY-Alpha-0.2.apk
