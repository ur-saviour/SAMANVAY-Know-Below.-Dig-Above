name: Build SAMANVAY Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - beta-0.2/recovery

permissions:
  contents: write

concurrency:
  group: samanvay-beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Diagnose and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --project-name samanvay \
            --org com.samanvay \
            --platforms android \
            /tmp/samanvay_scaffold

          cp -R /tmp/samanvay_scaffold/android .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Android application tag not found")
              content = content.replace("<application", permission + "\\n    <application", 1)

          deep_link_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="in.samanvay" android:host="login-callback" />
                  </intent-filter>
          """
          if 'android:host="login-callback"' not in content:
              content = content.replace("</activity>", deep_link_filter + "\\n        </activity>", 1)
          manifest.write_text(content)
          PY

          cp /tmp/samanvay_scaffold/pubspec.yaml .
          cp /tmp/samanvay_scaffold/analysis_options.yaml .
          cp /tmp/samanvay_scaffold/.metadata .
          mkdir -p lib
          cp app/main.dart lib/main.dart

      - name: Install Flutter dependencies
        run: |
          flutter pub add supabase_flutter
          flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare downloadable APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/SAMANVAY-Beta-0.2.apk
          echo "APK successfully prepared:"
          ls -lh dist/SAMANVAY-Beta-0.2.apk
          sha256sum dist/SAMANVAY-Beta-0.2.apk

      - name: Inspect APK package and signing
        continue-on-error: true
        run: |
          APK="dist/SAMANVAY-Beta-0.2.apk"
          file "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS" ]; then
            echo "Android build-tools unavailable; skipping detailed inspection."
            exit 0
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" || true
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" || true
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" || true

      - name: Upload APK download
        if: always() && hashFiles('dist/SAMANVAY-Beta-0.2.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAMANVAY-Beta-0.2-APK
          path: dist/SAMANVAY-Beta-0.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish SAMANVAY Beta 0.2
        if: github.event_name == 'workflow_dispatch' && hashFiles('dist/SAMANVAY-Beta-0.2.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-beta-0.2
          name: SAMANVAY Beta 0.2
          body: |
            SAMANVAY Android Application
            Version: Beta 0.2

            Includes:
            - Flutter release APK
            - Supabase integration foundation
            - APK package and signing diagnostics
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/SAMANVAY-Beta-0.2.apk
