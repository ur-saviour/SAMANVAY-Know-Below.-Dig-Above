
name: Build SAMANVAY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Validate SAMANVAY APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --project-name samanvay \
            --org in.samanvay \
            --platforms android \
            /tmp/samanvay_scaffold

          cp -R /tmp/samanvay_scaffold/android .
          cp /tmp/samanvay_scaffold/pubspec.yaml .
          cp /tmp/samanvay_scaffold/analysis_options.yaml .
          cp /tmp/samanvay_scaffold/.metadata .

          mkdir -p lib
          cp app/main.dart lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Validate APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"
          file "$APK"
          unzip -t "$APK"

          mkdir -p dist
          cp "$APK" dist/SAMANVAY-Alpha-0.1.apk

          echo "APK successfully built and validated."
          ls -lh dist/

      - name: Publish direct APK download
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-alpha-0.1
          name: SAMANVAY Alpha 0.1
          body: |
            SAMANVAY Android application.
            
            Version: Alpha 0.1
            Build: Release APK
            
            This is an early UI prototype.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/SAMANVAY-Alpha-0.1.apk
