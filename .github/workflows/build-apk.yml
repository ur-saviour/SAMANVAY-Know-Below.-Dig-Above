


name: Build SAMANVAY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build, Diagnose and Publish APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Generate Android project
      - name: Generate Android project
        run: |
          flutter create \
            --project-name samanvay \
            --org in.samanvay \
            --platforms android \
            /tmp/samanvay_scaffold

          cp -R /tmp/samanvay_scaffold/android .

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Android application tag not found")

              content = content.replace(
                  "<application",
                  permission + "\n    <application",
                  1,
              )

          manifest.write_text(content)
          PY

          cp /tmp/samanvay_scaffold/pubspec.yaml .
          cp /tmp/samanvay_scaffold/analysis_options.yaml .
          cp /tmp/samanvay_scaffold/.metadata .

          mkdir -p lib
          cp app/main.dart lib/main.dart

      # 5. Install dependencies
      - name: Install Flutter dependencies
        run: |
          flutter pub add supabase_flutter
          flutter pub get

      # 6. Check Dart code
      - name: Analyze Dart code
        run: flutter analyze

      # 7. Build APK
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # 8. Copy APK before diagnostics
      - name: Prepare downloadable APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/SAMANVAY-Alpha-0.2.apk

          echo "APK successfully prepared:"
          ls -lh dist/SAMANVAY-Alpha-0.2.apk

          sha256sum dist/SAMANVAY-Alpha-0.2.apk

      # 9. Diagnose APK (diagnostic failures won't block download)
      - name: Inspect APK package and signing
        continue-on-error: true
        run: |
          APK="dist/SAMANVAY-Alpha-0.2.apk"

          echo "========== APK FILE =========="
          file "$APK"
          ls -lh "$APK"

          echo "========== APK INTEGRITY =========="
          unzip -t "$APK"

          echo "========== ANDROID BUILD TOOLS =========="
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "Android build-tools unavailable; skipping detailed inspection."
            exit 0
          fi

          echo "Build tools: $BUILD_TOOLS"

          echo "========== PACKAGE INFORMATION =========="
          "$BUILD_TOOLS/aapt" dump badging "$APK" || true

          echo "========== SIGNATURE VERIFICATION =========="
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs "$APK" || true

          echo "========== ALIGNMENT CHECK =========="
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" || true

      # 10. ALWAYS upload APK as a downloadable artifact
      - name: Upload APK download
        if: always() && hashFiles('dist/SAMANVAY-Alpha-0.2.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SAMANVAY-Alpha-0.2-APK
          path: dist/SAMANVAY-Alpha-0.2.apk
          if-no-files-found: error
          retention-days: 30

      # 11. Publish GitHub Release when manually triggered
      - name: Publish SAMANVAY Alpha 0.2
        if: github.event_name == 'workflow_dispatch' && hashFiles('dist/SAMANVAY-Alpha-0.2.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: samanvay-alpha-0.2
          name: SAMANVAY Alpha 0.2
          body: |
            SAMANVAY Android Application
            Version: Alpha 0.2

            Includes:
            - Flutter release APK
            - Supabase integration foundation
            - APK package and signing diagnostics

          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/SAMANVAY-Alpha-0.2.apk
